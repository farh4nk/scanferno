<style>

.row b{font-size:18px;font-weight:700;display:block}.row small{display:block;color:var(--dim);font-size:14px}.row .d{font-weight:800;font-size:17px;text-align:right}

.rm{fill:#211a17;stroke:#6b5c52;stroke-width:4;transition:fill .2s}.rm.click{cursor:pointer}.rm.click:hover{fill:#2d231f}

.route.done{stroke:#6b5c52}

.st.done{color:#7a6a60}.st.done i{border-color:#7a6a60}.st.now{color:var(--white);font-size:21px;font-weight:700}.st.now i{background:var(--fire);border-color:var(--fire);color:var(--ink)}

.fwin{position:absolute;bottom:18px;right:18px;width:400px;background:rgba(16,12,11,.94);border:2px solid var(--fire);border-radius:12px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:in .3s cubic-bezier(.2,.8,.2,1)}

const S={t:0,playing:false,timer:null,speed:3,rec:null,recN:0,changed:[],planSel:null,layers:{order:1,routes:1,doors:1,heat:0},aerial:'oblique-south',mdRoom:'r-tx2gws',mdStep:0,evacT:0,evacPlay:false,ask:null};
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function tick(){S.t+=0.1*S.speed;const last=D.timeline.filter(x=>x.t<=S.t).pop();
 if(last&&last!==S.rec){S.changed=last.record.changed||[];S.rec=last;S.recN=D.timeline.indexOf(last)+1;}
 if(S.t>D.utterances.at(-1).end+1){S.playing=false;clearInterval(S.timer)} render(true)}
function play(){if(S.playing){S.playing=false;clearInterval(S.timer)}else{if(S.t>D.utterances.at(-1).end)S.t=0,S.rec=null;S.playing=true;S.timer=setInterval(tick,100)}render()}
// ---------- plan svg ----------
const xs=D.rooms.flatMap(r=>r.polygon.map(p=>p[0])),ys=D.rooms.flatMap(r=>r.polygon.map(p=>p[1]));
const X0=Math.min(...xs),X1=Math.max(...xs),Y0=Math.min(...ys),Y1=Math.max(...ys),SC=40,PAD=1.6;
const W=(X1-X0+2*PAD)*SC,H=(Y1-Y0+2*PAD)*SC,px=([x,y])=>`${((x-X0+PAD)*SC).toFixed(0)},${((Y1-y+PAD)*SC).toFixed(0)}`;
const fire=new Set(B.fire_room_ids||[]),victim=(B.trapped[0]||{}).room_id,order=Object.fromEntries(B.search_plan.map((s,i)=>[s.room_id,i+1]));
function plan({sel,route,routes=[],click,heat,orderOn=true,doors=true,agents,hiDoors=[],progress,sides=true}={}){
 const ms=D.maze;let s=`<svg class="plan" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}">`;
 for(const r of D.rooms){let c='rm';if(fire.has(r.id))c+=' fire';if(r.id===victim)c+=' victim';if(r.id===sel)c+=' sel';if(click)c+=' click';
  const st=heat&&!fire.has(r.id)&&r.id!==victim?` style="fill:rgba(255,90,31,${(ms[r.id]||0)*.75})"`:'';
  s+=`<polygon class="${c}"${st} data-room="${r.id}" points="${r.polygon.map(px).join(' ')}"/>`}
 for(const pl of [...routes,route].filter(Boolean)){s+=`<polyline class="route" points="${pl.map(px).join(' ')}"/>`}
 if(progress)s+=`<polyline class="route done" points="${progress.map(px).join(' ')}"/>`;
 if(doors)for(const d of D.doors){const [x,y]=px(d.p).split(',').map(Number);if(d.exit||hiDoors.includes(d.id))s+=`<rect class="ex" x="${x-9}" y="${y-9}" width="18" height="18"/>`}
 for(const r of D.rooms){const [x,y]=px(r.centroid).split(',');if(orderOn&&order[r.id]&&order[r.id]<=6)s+=`<g class="ord" transform="translate(${x},${y})"><circle r="17"/><text dy="7">${order[r.id]}</text></g>`;else s+=`<text class="lbl" x="${x}" y="${+y+5}">${esc(r.label.replace(/^(Office|Hallway|Kitchen) /,''))}</text>`}
 if(agents)for(const a of agents){if(!a)continue;const [x,y]=px(a).split(',');s+=`<circle class="ag" cx="${x}" cy="${y}" r="7"/>`}
 if(sides)s+=`<text class="sidel" x="${W/2}" y="${H-8}">A</text><text class="sidel" x="${W/2}" y="26">C</text><text class="sidel" x="16" y="${H/2}">B</text><text class="sidel" x="${W-16}" y="${H/2}">D</text>`;
 return s+'</svg>'}

 ${f('address','Address',r.address)}${f('floor','Floor',r.floor)}${f('side','Fire side',r.side)}${f('fire_location','Fire location',r.fire_location)}${f('conditions','Conditions',(r.conditions||[]).join(', '))}
 ${f('trapped','Trapped',(r.trapped||[]).map(t=>t.location||t.description).join('; '))}${f('hazards','Hazards',(r.hazards||[]).join(', '))}${f('caller_location','Caller is',r.caller_location)}</div>
 <div class="col"><div class="panel"><h2>How this works</h2><p class="note" style="font-size:15px">Each caller line is turned into these fields. Confidence bars show how sure the extractor is; a field flashes when the caller changes it.</p>

rescue:()=>{const sel=S.planSel||victim,rt=D.exit_routes[sel];return`<div class="page"><div class="split" style="grid-template-columns:520px 1fr"><div class="col">
 <div class="sign r"><div><small>Trapped · ${Math.round(B.trapped[0].confidence*100)}%</small><div class="big">${esc(B.trapped[0].description)} in ${esc(victimLabel)}</div><div class="sub">“${esc(D.dispatch.trapped?.[0]?.location||'')}” · floor ${D.dispatch.floor}</div></div></div>

entry:()=>`<div class="page"><div class="split" style="grid-template-columns:1fr 1fr"><div class="panel"><h2>Entry points <span>${B.entry_points.length} doors</span></h2>

 <div class="panel" style="display:flex;flex-direction:column"><h2>Doors <span>white squares are exits</span></h2><div style="flex:1;min-height:0">${plan({orderOn:false,hiDoors:[S.planSel]})}</div></div></div></div>`,
hazards:()=>{const srcs=[...new Set(hz.map(h=>h.source))];const on=S.hzSrc||null;return`<div class="page"><div class="panel" style="height:100%"><h2>Hazards <span>${hz.length} total</span></h2>
 <div class="chips" style="margin:6px 0 10px"><button class="chip ${!on?'on':''}" data-hz="">All</button>${srcs.map(s=>`<button class="chip ${on===s?'on':''}" data-hz="${s}">${s}</button>`).join('')}</div>
 ${hz.filter(h=>!on||h.source===on).map(h=>`<div class="row"><span class="sh ${h.severity==='high'?'r':'o'}">!</span><div><b>${esc(h.text)}</b><small>${h.severity} · ${h.kind.replace('_',' ')}</small></div><span class="src">${h.source}</span></div>`).join('')}</div></div>`},
hose:()=>`<div class="page"><div class="split" style="grid-template-columns:1fr 1fr"><div class="panel"><h2>Hose stretch <span>200 ft preconnect</span></h2>
 ${B.hose_stretch.map(h=>`<div class="row"><span class="sh ${h.fits_preconnect?'':'r'}">${h.side}</span><div><b>To ${esc(R[h.to_room_id]?.label)}</b><small>${h.interior_m} m inside · ${h.fits_preconnect?'fits preconnect':'needs extra length'}</small></div><span class="d">${h.total_ft} ft</span></div>`).join('')}</div>
 <div class="panel"><h2>Shortest stretch</h2><div class="stat">${B.hose_stretch[0].total_ft} ft<small>${esc(B.hose_stretch[0].text)}</small></div></div></div></div>`,
exterior:()=>`<div class="page"><div class="split" style="grid-template-columns:1fr 1fr"><div class="panel"><h2>Ladders</h2>

 <h2 style="margin-top:22px">Roof</h2><div class="row"><span class="sh o">R</span><div><b>${esc((D.asks['What is on the roof?']||{}).answer||'')}</b></div><span class="src">vexcel</span></div></div>
 <div class="panel"><h2>Notes</h2>${B.caveats.map(c=>`<div class="row" style="grid-template-columns:1fr"><span>${esc(c)}</span></div>`).join('')}</div></div></div>`,
aerial:()=>`<div class="page"><div class="panel" style="height:100%"><div class="imgtabs seg">${Object.keys(D.images).map(k=>`<button class="${S.aerial===k?'on':''}" data-img="${k}">${k.replace('oblique-','').replace('nadir','top-down')}</button>`).join('')}</div>
 <img class="aer" src="data:image/jpeg;base64,${D.images[S.aerial]}" alt="Aerial ${S.aerial}"></div></div>`,
plan:()=>{const sel=S.planSel&&R[S.planSel]?S.planSel:null,md=sel&&D.maze_detail[sel],L=S.layers;return`<div class="page"><div class="split" style="grid-template-columns:1fr 340px">
 <div class="col"><div class="chips"><div class="seg"><button class="on">2D</button><button title="3D needs the Matterport viewer">3D model</button></div>
 ${[['order','Search order'],['routes','Exit routes'],['doors','Doors'],['heat','Maze heat']].map(([k,l])=>`<button class="chip ${L[k]?'on':''}" data-layer="${k}">${l}</button>`).join('')}</div>
 <div style="flex:1;min-height:0">${plan({sel,click:1,orderOn:L.order,doors:L.doors,heat:L.heat,route:L.routes&&sel?D.exit_routes[sel]?.polyline:null,routes:L.routes&&!sel?[D.exit_routes[victim].polyline]:[]})}</div></div>
 <div class="panel">${sel?`<h2>Selected room</h2><div style="font-size:28px;font-weight:800">${esc(R[sel].label)}</div><p class="note">${R[sel].type} · ${R[sel].area_m2} m² · side ${R[sel].side}</p>
  <div class="sign" style="margin:14px 0"><div style="padding:8px 14px"><small>Maze score</small><div class="big" style="font-size:26px">${(D.maze[sel]||0).toFixed(2)}${md?.dead_end?' · dead end':''}</div></div></div>
  ${(md?.why||[]).map(w=>`<div class="row" style="grid-template-columns:1fr;padding:8px 0">${esc(w)}</div>`).join('')}
  <button class="btn f" data-go="mayday" data-md="${sel}" style="width:100%;justify-content:space-between;height:46px;margin-top:16px">Mayday from here${ic('arrow')}</button>`
  :`<h2>Floor plan</h2><p class="note" style="font-size:15px">Tap any room for its maze score, exit route and mayday directions. Toggle layers above.</p>`}</div></div></div>`},
mayday:()=>{const m=D.mayday[S.mdRoom];const n=m.directions.length,k=S.mdStep;const wp=m.wall_path,cut=Math.round(wp.length*k/n);
 return`<div class="page"><div class="split" style="grid-template-columns:1fr 480px"><div class="col">
 <div style="display:flex;gap:10px"><select data-mdsel style="flex:1">${Object.keys(D.mayday).map(id=>`<option value="${id}" ${id===S.mdRoom?'selected':''}>Last known room: ${esc(R[id].label)} · side ${R[id].side}</option>`).join('')}</select></div>
 <div class="sign"><div><small>Hand on wall</small><div class="big">${m.hand[0].toUpperCase()+m.hand.slice(1)} hand · ${m.distance_m} m to Side ${m.exit_side} exit</div><div class="sub">Passes ${m.doors_passed} door${m.doors_passed===1?'':'s'} · shortest path ${m.shortest_m} m</div></div></div>
 <div class="panel steps" style="flex:1">${m.directions.map((d,i)=>`<div class="st ${i<k?'done':i===k?'now':''}"><i>${i+1}</i>${esc(d)}</div>`).join('')}</div></div>
 <div class="col"><div class="panel" style="flex:1;padding:10px">${plan({sel:S.mdRoom,orderOn:false,route:wp.slice(Math.max(cut-1,0)),progress:cut>1?wp.slice(0,cut):null})}</div>
 <div style="display:flex;gap:10px"><button class="btn" data-mdprev style="height:48px" ${k===0?'disabled':''}>${ic('back')}</button><button class="btn" data-speak style="flex:1;height:48px;justify-content:center">${ic('speak')}Speak step</button>
 <button class="btn f" data-mdnext style="flex:1;height:48px;justify-content:center" ${k>=n-1?'disabled':''}>Next step${ic('arrow')}</button></div></div></div></div>`},
evac:()=>{const fr=D.evac.frames,i=Math.min(S.evacT,fr.length-1),out=fr[i].agents.filter(a=>!a).length;return`<div class="page"><div class="split" style="grid-template-columns:1fr 340px">
 <div class="panel" style="padding:10px">${plan({orderOn:false,agents:fr[i].agents,sides:true})}</div>
 <div class="col"><div class="panel"><h2>Evacuation sim</h2><div class="stat">${fr[i].t.toFixed(0)} s<small>${out} of ${D.evac.occupants} out</small></div>
 <div class="bar" style="margin:14px 0"><i style="width:${out/D.evac.occupants*100}%"></i></div>
 <button class="btn f" data-evac style="width:100%;justify-content:center;height:48px">${ic(S.evacPlay?'pause':'play')}${S.evacPlay?'Pause':i>=fr.length-1?'Run again':'Run sim'}</button></div>
 <div class="panel"><div class="row" style="grid-template-columns:1fr auto"><span>Clear time</span><b>${D.evac.clear_time_s} s</b></div><div class="row" style="grid-template-columns:1fr auto"><span>Bottleneck door</span><b>${D.evac.bottleneck_door_id.replace('d-','')}</b></div>
 ${Object.entries(D.evac.per_exit).map(([d,n])=>`<div class="row" style="grid-template-columns:1fr auto"><span>Exit ${d.replace('d-','')}</span><b>${n} people</b></div>`).join('')}</div></div></div></div>`},
ask:()=>{const a=S.ask&&D.asks[S.ask];const hl=a?.highlight||{};return`<div class="page"><div class="split" style="grid-template-columns:1fr 1fr"><div class="col">
 <form class="askbar" data-ask>${ic('ask')}<input name="q" value="${esc(S.askQ||'')}" placeholder="Ask about this building"><button class="btn f">Ask</button></form>
 <div class="chips">${Object.keys(D.asks).map(q=>`<button class="chip ${S.ask===q?'on':''}" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
 <div class="panel" style="flex:1">${a?`<h2>Answer <span>offline rules</span></h2><div class="answer">${esc(a.answer)}</div>`:S.askQ?`<h2>Answer</h2><p class="note" style="font-size:15px">This prototype only has answers cached for the suggested questions. The real app asks Gemini.</p>`:`<h2>Ask</h2><p class="note" style="font-size:15px">Pick a suggested question. Answers highlight rooms and routes on the plan.</p>`}</div></div>
 <div class="panel" style="padding:10px">${plan({sel:hl.rooms?.[0],orderOn:false,routes:(hl.polylines||[]),hiDoors:hl.doors||[]})}</div></div></div>`},
};
// ---------- shell ----------
function route(){return location.hash.slice(1)||'home'}
function render(soft){const id=route(),p=P[id],strip=document.getElementById('strip');
 const live=S.playing?`<span class="live">● Call replay ${fmt(S.t)}</span>`:`<span class="live idle">Call ${S.t?'paused '+fmt(S.t):'not playing'}</span>`;
 if(id==='home')strip.innerHTML=`<div class="sf">SF</div><span class="bld">Vibe Hobby · 8866 Gulf Fwy, Houston</span>${live}<span class="crumb">${esc(B.summary.split('.')[0])}</span><button class="btn ml">${ic('search')}Change building</button>`;
 else{const i=PAGES.indexOf(p),nx=PAGES[i+1];strip.innerHTML=`<button class="btn" data-go="home">${ic('back')}Home</button><span class="crumb">${p.group} › <b>${p.name}</b></span><span class="bld" style="font-weight:600;color:var(--dim)">Vibe Hobby</span>${live}${nx?`<button class="btn f ml" data-go="${nx.id}">Next: ${nx.name}${ic('arrow')}</button>`:''}`}
 if(soft&&!['home','call','facts'].includes(id))return;
 const app=document.getElementById('app');const keep=soft?app.querySelector('.panel')?.scrollTop:0;
 app.innerHTML=V[id]?V[id]():V.home();if(soft){app.querySelector('.page').style.animation='none';const pn=app.querySelector('.panel');if(pn&&id==='call')pn.scrollTop=pn.scrollHeight;else if(pn)pn.scrollTop=keep}}
function go(id){location.hash=id==='home'?'':id}
addEventListener('hashchange',()=>{S.planSel=null;render()});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-room],polygon');if(!t)return;const d=t.dataset;
 if(d.go){if(d.md){S.mdRoom=d.md;S.mdStep=0}go(d.go);return}
 if(d.play!=null)return play();
 if(d.speed!=null){S.speed=S.speed===3?1:S.speed===1?6:3;return render()}
 if(d.room){S.planSel=d.room;return render()}
 if(d.door){S.planSel=d.door;return render()}
 if(d.hz!=null){S.hzSrc=d.hz||null;return render()}
 if(d.img){S.aerial=d.img;return render()}
 if(d.layer){S.layers[d.layer]=!S.layers[d.layer];return render()}
 if(d.mdnext!=null){S.mdStep++;render();return}
 if(d.mdprev!=null){S.mdStep--;return render()}
 if(d.speak!=null){const m=D.mayday[S.mdRoom];speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(m.directions[S.mdStep]));return}
 if(d.q){S.ask=d.q;S.askQ=d.q;return render()}
 if(d.evac!=null){const fr=D.evac.frames;if(S.evacPlay){S.evacPlay=false;clearInterval(S.et)}else{if(S.evacT>=fr.length-1)S.evacT=0;S.evacPlay=true;S.et=setInterval(()=>{S.evacT++;if(S.evacT>=fr.length-1){S.evacPlay=false;clearInterval(S.et)}route()==='evac'&&render()},450)}return render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-mdsel]')){S.mdRoom=e.target.value;S.mdStep=0;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const q=new FormData(e.target).get('q').trim();if(!q)return;S.askQ=q;S.ask=Object.keys(D.asks).find(k=>k.toLowerCase().includes(q.toLowerCase().slice(0,12)))||null;go('ask');render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&route()!=='home')go('home')});
render();
</script>
<script>
// ---------- v2: briefing-first home ----------
V.all = V.home; // the old tile page becomes "All tools"
P.all = {id:'all', name:'All tools', group:'Tools'};
S.step = 0; S.narrating = false;
const pt = p => px(p).split(',').map(Number);
const doorById = Object.fromEntries(D.doors.map(d => [d.id, d]));
const SEARCH = B.entry_points.find(e => e.role === 'search') || B.entry_points[0];
const ATTACK = B.entry_points.find(e => e.role === 'attack');
const vRoute = D.exit_routes[victim];
const deadEnd = Object.entries(D.maze_detail).filter(([id, m]) => m.dead_end).sort((a, b) => (D.maze[b[0]] || 0) - (D.maze[a[0]] || 0))[0][0];
const hose = B.hose_stretch[0];
const FINAL = D.timeline.at(-1).record;
const fireIds = B.fire_room_ids || [];
// what the call has revealed so far (replaying) or everything (idle)
function known() {
  if (!S.t) return {victim: true, fire: true, o2: true, rec: D.dispatch};
  const r = S.rec?.record || {};
  return {victim: !!(r.trapped || []).length, fire: !!(r.fire_location || r.side), o2: (r.hazards || []).some(h => /oxygen/i.test(h)), rec: r};
}
const STEPS = [
  {k: 'Arrive', say: () => `Arriving at ${B.building.name}, ${B.building.stories} story ${B.building.construction.toLowerCase()} office, sprinklered. Front is side A, facing the freeway. Fire reported side C, the rear, floor ${D.dispatch.floor}. Aerial device needed on A and C.`},
  {k: 'Enter', say: () => `Search crew enters side A through the door into ${R[doorById[SEARCH.door_id]?.rooms.find(r => r !== 'outside')]?.label || 'the front office'}. Attack line through the hallway door, about ${hose.total_ft} feet to the fire, inside a 200 foot preconnect.`},
  {k: 'Search', say: () => `Trapped: ${B.trapped[0].description} likely in ${victimLabel}, about ${vRoute.distance_m} meters from the door. Then search ${B.search_plan.slice(1, 4).map(s => s.label).join(', ')}.`},
  {k: 'Get out', say: () => `Nearest exit from ${victimLabel} is ${vRoute.distance_m} meters, side A. ${R[deadEnd].label} is a dead end with no window. If lost, call a mayday and follow the wall.`},
];
function planHome(step) {
  const kn = known();
  let s = `<svg class="plan hp" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}"><defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#3a130e"/><line x1="0" y1="0" x2="0" y2="14" stroke="#d42a1e" stroke-width="5"/></pattern></defs>`;
  for (const r of D.rooms) {
    const isFire = kn.fire && fireIds.includes(r.id), isV = kn.victim && r.id === victim;
    const dim = (step === 0) ? ' dimr' : '';
    s += `<polygon class="rm${isFire ? ' hf' : ''}${isV ? ' victim' : ''}${step === 3 && r.id === deadEnd ? ' de' : ''}${dim}" data-room="${r.id}" points="${r.polygon.map(px).join(' ')}"/>`;
  }
  // step overlays
  if (step === 1) { // entry: attack line + doors
    const fr = D.exit_routes[hose.to_room_id]; if (fr) s += `<polyline class="hoseln" points="${[...fr.polyline].reverse().map(px).join(' ')}"/>`;
  }
  if (step === 2 && kn.victim) s += `<polyline class="route go" points="${[...vRoute.polyline].reverse().map(px).join(' ')}"/>`;
  if (step === 3) {
    for (const sp of B.search_plan.slice(0, 6)) { const r = D.exit_routes[sp.room_id]; if (r) s += `<polyline class="route out${sp.room_id === victim ? '' : ' thin'}" points="${r.polyline.map(px).join(' ')}"/>`; }
  }
  // exits
  for (const d of D.doors) if (d.exit) { const [x, y] = pt(d.p); s += `<rect class="ex${step === 3 ? ' big' : ''}" x="${x - (step === 3 ? 13 : 9)}" y="${y - (step === 3 ? 13 : 9)}" width="${step === 3 ? 26 : 18}" height="${step === 3 ? 26 : 18}"/>`; }
  // labels on plan
  const tag = (p, txt, cls = '', dy = -34) => { const w = txt.length * 10.5 + 28; const x = Math.min(Math.max(p[0], w / 2 + 6), W - w / 2 - 6), y = p[1]; return `<g class="tag ${cls}" transform="translate(${x},${y + dy})"><rect x="${-w / 2}" y="-17" width="${w}" height="34" rx="6"/><text dy="6">${esc(txt)}</text></g>`; };
  if (step === 1) {
    const sd = doorById[SEARCH.door_id], ad = ATTACK && doorById[ATTACK.door_id];
    if (sd) s += tag(pt(sd.p), 'SEARCH · ENTER HERE', 'f', 44);
    const fr2 = D.exit_routes[hose.to_room_id]; if (fr2) s += tag(pt(fr2.polyline.at(-1)), 'ATTACK LINE · ' + hose.total_ft + ' FT', '', 84);
  }
  if (step === 2) {
    if (kn.victim) { const [x, y] = pt(R[victim].centroid); s += `<circle class="pulse" cx="${x}" cy="${y}" r="26"/><circle class="vdot" cx="${x}" cy="${y}" r="14"/>`; s += tag([x, y], 'TRAPPED · ' + R[victim].label.toUpperCase(), 'r', -44); }
    B.search_plan.slice(1, 5).forEach((sp, i) => { const [x, y] = pt(R[sp.room_id].centroid); s += `<g class="ord" transform="translate(${x},${y})"><circle r="19"/><text dy="7">${i + 2}</text></g>`; });
    if (vRoute && kn.victim) s += tag(pt(vRoute.polyline.at(-1)), 'ENTER · ' + vRoute.distance_m + ' M TO VICTIM', 'f', 44);
  }
  if (step === 3) {
    const [x, y] = pt(R[deadEnd].centroid); s += tag([x, y], 'DEAD END · NO WINDOW', 'warn', 0);
    if (kn.victim) s += tag(pt(vRoute.polyline.at(-1)), 'NEAREST EXIT · ' + vRoute.distance_m + ' M', 'f', 44);
  }
  if (kn.fire && step !== 0) { const c = R[fireIds[0]]?.centroid; if (c) { const [x, y] = pt(c); s += tag([x + 60, y], kn.o2 ? 'FIRE · O₂ CYLINDERS REPORTED' : 'FIRE AREA', 'r', -62); } }
  if (step === 0) { s += tag([W / 2, 40], 'C · REAR · FIRE SIDE', kn.fire ? 'r' : '', 0); s += tag([W / 2, H - 30], 'A · FRONT · GULF FWY', 'f', 0); }
  s += `<text class="sidel" x="${W / 2}" y="${H - 8}">${step === 0 ? '' : 'A'}</text><text class="sidel" x="${W / 2}" y="26">${step === 0 ? '' : 'C'}</text><text class="sidel" x="16" y="${H / 2}">B</text><text class="sidel" x="${W - 16}" y="${H / 2}">D</text>`;
  return s + '</svg>';
}
// ---------- diagrams ----------
const FLOORS = B.building.stories, FFLOOR = FINAL.floor, ROOF = B.building.roof_height_m, PEOPLE = B.occupancy.employees_on_floor;
const exitsAll = D.doors.filter(d => d.exit);
const svgI = (w, h, body, cls = '') => `<svg class="dg ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${body}</svg>`;
// small pictograms for the key band (64x64)
const PICT = {
  Fire: kn => svgI(64, 64, `${Array.from({length: FLOORS}, (_, i) => { const f = FLOORS - i, y = 6 + i * 11; return `<rect x="12" y="${y}" width="30" height="9" rx="1.5" class="${kn.fire && f === FFLOOR ? 'pf' : 'pb'}"/>`; }).join('')}
    <rect x="6" y="62" width="44" height="2" class="pg"/>${kn.fire ? `<path d="M52 ${6 + (FLOORS - FFLOOR) * 11 + 9}c-4-3-3-7 0-10 0 3 3 4 3 6 1-1 1-3 0-4 3 2 4 6 1 8z" class="pfl"/>` : ''}

const KEY = () => { const kn = known(); return [
  {k: 'Fire', v: kn.fire ? `Floor ${FFLOOR} · Side ${FINAL.side}` : 'Listening…', s: [0], hot: kn.fire, off: !kn.fire, kn},
  {k: 'Watch', v: kn.o2 ? 'O₂ cylinders' : 'Listening…', s: [1], off: !kn.o2, kn},
  {k: 'Enter', v: `Side ${SEARCH.side} door`, s: [1], kn},
  {k: 'Trapped', v: kn.victim ? victimLabel : 'Listening…', s: [2], hot: kn.victim, off: !kn.victim, kn},

// building section: floors, fire floor, people, height ruler, aerial sides
function sectionSVG(kn) {
  const W2 = 400, H2 = 236, fh = 36, x0 = 40, bw = 200, base = 206;
  let s = `<line x1="20" y1="${base}" x2="${W2 - 20}" y2="${base}" class="sg"/>`;
  for (let f = 1; f <= FLOORS; f++) {

  s += `<text x="${rx + 10}" y="${top + 24}" class="slab l">aerial device</text><text x="${rx + 10}" y="${top + 40}" class="slab l">on A and C</text>`;
  // sprinkler mark
  s += `<g transform="translate(${x0 + 6},${top - 14})"><path d="M0 8h40M8 8v-6M32 8v-6" class="srule"/><text x="48" y="10" class="slab l">sprinklered</text></g>`;

// hose gauge
function hoseSVG() {
  const W2 = 400, len = 200, ft = hose.total_ft, x0 = 16, w = W2 - 40, fx = x0 + w * ft / len;
  return svgI(W2, 84, `<rect x="${x0}" y="28" width="${w}" height="22" rx="11" class="gtrack"/><rect x="${x0}" y="28" width="${fx - x0}" height="22" rx="11" class="gfill"/>
    <line x1="${fx}" y1="20" x2="${fx}" y2="58" class="gmark"/><text x="${fx}" y="14" class="gl c">${ft} ft to the fire</text>
    ${[0, 50, 100, 150, 200].map(v => `<text x="${x0 + w * v / len}" y="76" class="gl c dim">${v}</text>`).join('')}<text x="${x0 + w}" y="14" class="gl r dim">200 ft preconnect</text>`, 'wide');
}
// distance scale door -> victim
function distSVG(m, label) {
  const W2 = 400, x0 = 46, x1 = 340;
  return svgI(W2, 70, `<rect x="${x0 - 30}" y="20" width="22" height="30" rx="2" class="pdoor"/><text x="${x0 - 19}" y="66" class="gl c dim">door</text>
    <line x1="${x0}" y1="35" x2="${x1}" y2="35" class="dline"/>${Array.from({length: Math.floor(m) + 1}, (_, i) => `<line x1="${x0 + (x1 - x0) * i / m}" y1="30" x2="${x0 + (x1 - x0) * i / m}" y2="40" class="dtick"/>`).join('')}

    <text x="${(x0 + x1) / 2}" y="22" class="gl c">${m} m${label ? ' · ' + label : ''}</text>`, 'wide');

// confidence ring
const ring = (p, sz = 64) => { const r = sz / 2 - 6, c = 2 * Math.PI * r; return svgI(sz, sz, `<circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" class="rtrack"/><circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" class="rfill" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${sz / 2} ${sz / 2})"/><text x="${sz / 2}" y="${sz / 2 + 6}" class="rtx">${Math.round(p * 100)}%</text>`); };
// search chain
const reasonIcon = r => /fire area/i.test(r) && !/next/i.test(r) ? 'fire' : /next to/i.test(r) ? 'adj' : /self-evac|maze/i.test(r) ? 'maze' : 'person';
const MINI = {
  fire: `<path d="M12 21c-5-3-6-9-1-14 0 4 3 5 3 8 2-2 2-5 1-7 5 3 7 9 2 13z" class="ifl"/>`,
  adj: `<rect x="3" y="5" width="8" height="14" rx="1" class="iad"/><rect x="13" y="5" width="8" height="14" rx="1" class="iad2"/>`,
  maze: `<path d="M4 4h16v16H4zM8 4v12h8V8" class="imz"/>`,
  person: `<circle cx="12" cy="8" r="4" class="ip"/><path d="M5 21c0-5 3-8 7-8s7 3 7 8" class="ip"/>`,
};
function chainHTML() {
  const list = B.search_plan.slice(1, 6);
  return `<div class="chain">${list.map((s, i) => `<button class="link" data-room="${s.room_id}"><span class="node">${i + 2}</span><svg class="mi" viewBox="0 0 24 24">${MINI[reasonIcon(s.reason)]}</svg><b>${esc(s.label)}</b><span class="d">${D.exit_routes[s.room_id] ? D.exit_routes[s.room_id].distance_m + ' m out' : ''}</span></button>`).join('')}</div>
   <div class="legend2"><span><svg class="mi" viewBox="0 0 24 24">${MINI.fire}</svg>fire area</span><span><svg class="mi" viewBox="0 0 24 24">${MINI.adj}</svg>next to fire</span><span><svg class="mi" viewBox="0 0 24 24">${MINI.maze}</svg>hard to escape</span></div>`;
}
// exit distance bars
function exitBars() {
  const rows = B.search_plan.slice(0, 6).map(s => ({id: s.room_id, l: s.label, m: D.exit_routes[s.room_id]?.distance_m || 0}));
  rows.push({id: deadEnd, l: R[deadEnd].label, m: D.exit_routes[deadEnd]?.distance_m || 0});
  const uniq = [...new Map(rows.map(r => [r.id, r])).values()], mx = Math.max(...uniq.map(r => r.m)), W2 = 400;
  return svgI(W2, uniq.length * 34 + 8, uniq.map((r, i) => { const y = i * 34 + 4, w = (W2 - 170) * r.m / mx, v = r.id === victim, de = r.id === deadEnd;
    return `<text x="0" y="${y + 19}" class="bl ${v ? 'v' : ''}">${esc(r.l)}</text><rect x="120" y="${y + 4}" width="${w}" height="22" rx="4" class="${v ? 'bv' : de ? 'bd' : 'bb'}"/><text x="${126 + w}" y="${y + 20}" class="bl n">${r.m} m${de ? ' · dead end' : ''}</text>`; }).join(''), 'wide');
}
function deadEndSVG() {
  return svgI(120, 106, `<rect x="10" y="10" width="100" height="70" rx="3" class="drm"/><rect x="10" y="38" width="5" height="16" class="ddr"/><path d="M30 45h55M75 37l10 8-10 8" class="dx"/><path d="M88 20l14 14M102 20L88 34" class="dxx"/><text x="60" y="100" class="gl c dim">1 door · no window</text>`);
}
function stepPanel(step) {
  const kn = known();
  if (step === 0) return `<div class="photo"><img src="data:image/jpeg;base64,${D.images['oblique-south']}" alt="Side A from the street">
    <span class="sl a">A</span><span class="sl b">B</span><span class="sl c ${kn.fire ? 'hot' : ''}">C${kn.fire ? ' · FIRE' : ''}</span><span class="sl d">D</span></div>
    <div class="card">${sectionSVG(kn)}</div>`;
  if (step === 1) return `<div class="card"><h3>Search crew <span>Side A door into ${esc(R[doorById[SEARCH.door_id]?.rooms.find(r => r !== 'outside')]?.label || '')}</span></h3>${distSVG(8, 'to the trapped person')}</div>
    <div class="card"><h3>Attack line <span>Side A hallway door</span></h3>${hoseSVG()}</div>
    <div class="card"><h3>Watch</h3><div class="hzrow">${PICT.Watch(kn)}<div><b>${kn.o2 ? 'O₂ cylinders' : 'Nothing reported yet'}</b><span>${kn.o2 ? 'rear of the driving school suite, near the fire' : ''}</span></div></div></div>`;
  if (step === 2) return kn.victim ? `<div class="sign r"><div class="trow">${ring(B.trapped[0].confidence)}<div><small>Trapped · from the caller</small><div class="big">${esc(victimLabel)}</div><div class="sub">“${esc(FINAL.trapped?.[0]?.location || '')}”</div></div></div></div>
    <div class="card">${distSVG(vRoute.distance_m, 'door to victim')}</div><div class="card"><h3>Then search</h3>${chainHTML()}</div>`
    : `<div class="sign"><div><small>Trapped</small><div class="big">Not reported yet</div><div class="sub">Listening to the caller…</div></div></div><div class="card"><h3>Search order so far</h3>${chainHTML()}</div>`;
  return `<div class="card"><h3>Distance to the nearest exit</h3>${exitBars()}</div>
    <div class="card dead"><div class="hzrow">${deadEndSVG()}<div><b>${esc(R[deadEnd].label)} is a dead end</b><span>One way in, one way out</span></div></div></div>
    <button class="btn red" data-go="mayday" data-md="${victim}" style="height:52px;justify-content:space-between">Mayday: wall-follow directions${ic('arrow')}</button>`;
}
function factsWin(st) {
  return `<div class="fwin"><div class="fhead"><span class="dotlive"></span>Briefing · step ${st + 1} of 4 · ${STEPS[st].k}</div>
   ${KEY().map(f => `<div class="frow ${f.s.includes(st) ? 'now' : ''} ${f.hot ? 'hot' : ''}"><span>${f.k}</span><b>${esc(f.v)}</b></div>`).join('')}
   <p class="caption" id="caption">${esc(STEPS[st].say())}</p></div>`;
}
function readPanel(st) {
  return `<div class="readp"><h2>Briefing <span>tap a step to show it on the plan</span></h2>
   ${STEPS.map((x, i) => `<button class="para ${i === st ? 'on' : ''}" data-step="${i}"><i>${i + 1}</i><div><b>${x.k}</b><p>${esc(x.say())}</p></div></button>`).join('')}
</div>`;
}
V.home = () => {
  const st = S.step, last = D.utterances.filter(u => u.start <= S.t).at(-1);
  return `<div class="page brief">
  <div class="keyband">${KEY().map(f => `<div class="kcell ${f.s.includes(st) ? 'now' : ''} ${f.hot ? 'hot' : ''} ${f.off ? 'off' : ''}">${PICT[f.k](f.kn)}<div><span>${f.k}</span><b>${esc(f.v)}</b></div></div>`).join('')}</div>
  <div class="stage panel"><div class="planwrap">${planHome(st)}</div>
    ${S.narrating ? `<p class="caption" id="caption">${esc(STEPS[st].say())}</p>` : S.t ? `<div class="ticker"><span class="dotlive"></span><b>${last ? last.role : 'call'}</b> ${esc(last?.text || 'Connecting…')}</div>` : ''}</div>
  <div class="side">${S.reading ? readPanel(st) : stepPanel(st)}</div>
  <div class="stepper">${STEPS.map((s, i) => `<button class="stp ${i === st ? 'on' : ''} ${i < st ? 'past' : ''}" data-step="${i}"><i>${i + 1}</i>${s.k}</button>`).join('')}
    <button class="btn f play" data-brief>${ic(S.narrating ? 'pause' : 'speak')}${S.narrating ? 'Stop' : 'Play'}</button>
    <button class="btn play ${S.reading ? 'on' : ''}" data-read>${ic('facts')}${S.reading ? 'Close text' : 'Read'}</button></div></div>`;
};
function narrate(i) {
  if (!S.narrating || i >= STEPS.length) { S.narrating = false; render(); return; }
  S.step = i; render();
  const txt = STEPS[i].say(); const u = new SpeechSynthesisUtterance(txt); u.rate = 1.05;
  u.onboundary = ev => { const c = document.getElementById('caption'); if (!c) return; const a = ev.charIndex, b = txt.indexOf(' ', a + 1); const e2 = b < 0 ? txt.length : b;
    c.innerHTML = `<span class="said">${esc(txt.slice(0, a))}</span><mark>${esc(txt.slice(a, e2))}</mark>${esc(txt.slice(e2))}`; };
  u.onend = () => setTimeout(() => narrate(i + 1), 350);
  speechSynthesis.speak(u);
}
const TOOLS = [['call', 'Call'], ['plan', 'Floor plan'], ['mayday', 'Mayday'], ['evac', 'Evac'], ['aerial', 'Photos'], ['ask', 'Ask'], ['all', 'All']];
const _render = render;
render = function (soft) {
  const id = route();
  if (id !== 'home') return _render(soft);
  const kn = known(), r = kn.rec || {};
  document.getElementById('strip').innerHTML = `<div class="sf">SF</div><span class="bld">${B.building.name} · 8866 Gulf Fwy</span>
   ${S.playing ? `<span class="live">● Call ${fmt(S.t)}</span>` : `<button class="btn" data-play>${ic('play')}${S.t ? 'Resume call' : 'Replay call'}</button>`}
   <nav class="tools ml">${TOOLS.map(([k, l]) => `<button data-go="${k}">${l}</button>`).join('')}</nav>`;
  const app = document.getElementById('app'); app.innerHTML = V.home();
  if (soft) app.querySelector('.page').style.animation = 'none';
};
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.step != null) { speechSynthesis.cancel(); S.narrating = false; S.step = +t.dataset.step; render(); }
  if (t.dataset.read != null) { S.reading = !S.reading; render(); return; }
  if (t.dataset.brief != null) { speechSynthesis.cancel(); S.narrating = !S.narrating; if (S.narrating) narrate(0); else render(); }
}, true);
document.addEventListener('keydown', e => { if (route() === 'home' && /^[1-4]$/.test(e.key)) { S.step = +e.key - 1; render(); } });
render();
</script></body></html>
